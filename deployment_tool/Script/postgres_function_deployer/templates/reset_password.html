<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Reset Password | DBA Operations Platform</title>
  <link rel="stylesheet" href="/static/css/style.css?v=enterprise3">
</head>
<body class="auth-page">
  <main class="login-card">
    <div class="brand-mark">PG</div>
    <p class="eyebrow accent">ACCOUNT RECOVERY</p>
    <h1>Reset Password</h1>
    {% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('reset_password', token=token) }}" autocomplete="off">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>New Password<input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
      <label>Confirm New Password<input name="confirm_password" type="password" required minlength="8" autocomplete="new-password"></label>
      <button class="btn btn-warning w-100" type="submit">Reset Password</button>
    </form>
  </main>
</body>
</html>
