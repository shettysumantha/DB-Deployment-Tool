<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Forgot Password | DBA Operations Platform</title>
  <link rel="stylesheet" href="/static/css/style.css?v=enterprise3">
</head>
<body class="auth-page">
  <main class="login-card">
    <div class="brand-mark">PG</div>
    <p class="eyebrow accent">ACCOUNT RECOVERY</p>
    <h1>Forgot Password</h1>
    {% if message %}<div class="notice" role="status">{{ message }}</div>{% endif %}
    <form method="post" action="{{ url_for('forgot_password') }}" autocomplete="off">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Username or Email<input name="identifier" required autocomplete="username"></label>
      <button class="btn btn-warning w-100" type="submit">Send Reset Request</button>
    </form>
    <nav class="auth-links"><a href="{{ url_for('login') }}">Return to Login</a></nav>
  </main>
</body>
</html>
