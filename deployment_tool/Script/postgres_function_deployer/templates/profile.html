<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Profile | Database Operations</title>
  <link rel="stylesheet" href="/static/css/style.css?v=enterprise3">
</head>
<body class="app-page">
  {% include 'partials_sidebar.html' %}
  <header class="topbar dashboard-topbar"><div class="page-shell dashboard-topbar-inner"><div class="brand"><span class="brand-mark">PG</span><div><div class="eyebrow">DATABASE OPERATIONS</div><h1>Function Deployment Manager</h1></div></div><div class="header-user"><strong>{{ session.get('username') }}</strong><span>{{ current_roles|join(' / ') }}</span></div></div></header>
  <main class="main-content admin-content">
    <header class="admin-page-heading"><div><p class="eyebrow accent">ACCOUNT</p><h1>Change Password</h1></div></header>
    {% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
    <section class="admin-section profile-password-section">
      <form class="admin-form profile-password-form" method="post" action="{{ url_for('profile_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>Current Password<input name="current_password" type="password" required autocomplete="current-password"></label>
        <label>New Password<input name="new_password" type="password" required minlength="8" autocomplete="new-password"></label>
        <label>Confirm New Password<input name="confirm_password" type="password" required minlength="8" autocomplete="new-password"></label>
        <button class="btn btn-primary" type="submit">Change Password</button>
      </form>
    </section>
  </main>
</body>
</html>
